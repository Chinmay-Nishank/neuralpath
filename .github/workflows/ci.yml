name: NeuralPath CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python verification dependencies
        run: python -m pip install numpy==2.2.3 pandas==2.2.3 scikit-learn==1.6.1 torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify every MDX Python code example
        run: npm run verify:code

      - name: Lint & Typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build production bundle & Pagefind index
        run: |
          npm run generate:cheatsheets
          npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E, Visual & Axe Accessibility Suite
        run: npm run test:e2e

      - name: Run Lighthouse CI
        run: npx @lhci/cli autorun

